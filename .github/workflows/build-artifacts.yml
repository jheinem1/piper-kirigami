name: Build development artifacts

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional vX.Y.Z to publish from main; blank builds/tests only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: JamesOS Flatpak · KDE 6.11 · x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test source packaging
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Install build tools and matching Flathub dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus-x11 xvfb xauth
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.kde.Platform/x86_64/6.11 org.kde.Sdk/x86_64/6.11 io.qt.PySide.BaseApp/x86_64/6.11
          # Builder 1.4 supports the current SDK's appstreamcli. Run it natively
          # so the isolated display does not cross a second sandbox boundary.
          flatpak-builder --version
      - name: Build, test model and QML, and export development bundle
        run: xvfb-run -a -s "-screen 0 1600x1100x24" dbus-run-session -- bash packaging/flatpak/build.sh "$RUNNER_TEMP/flatpak-artifacts"
      - name: Install bundle and verify its runtime in this disposable runner
        run: |
          flatpak install --user --noninteractive -y --bundle \
            "$RUNNER_TEMP/flatpak-artifacts/io.github.jheinem1.PiperKirigami-x86_64-development.flatpak"
          dbus-run-session -- bash packaging/flatpak/smoke-installed.sh "$RUNNER_TEMP/flatpak-artifacts"
      - name: Prepare versioned release metadata
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python3 packaging/prepare-release.py "$RUNNER_TEMP/flatpak-artifacts" "$RELEASE_TAG"
      - name: Upload tested Flatpak, source, checksums and build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piper-kirigami-flatpak-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/flatpak-artifacts/
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: Optional native RPM · Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare committed source and generated spec
        run: python3 packaging/prepare-source.py --output "$RUNNER_TEMP/rpmbuild"
      - name: Build and test in matching Fedora container
        env:
          FEDORA: ${{ matrix.fedora }}
        run: |
          docker run --rm -v "$RUNNER_TEMP/rpmbuild:/rpmbuild" \
            "registry.fedoraproject.org/fedora:$FEDORA" bash -euc '
              dnf install -y rpm-build dnf5-plugins
              dnf builddep -y /rpmbuild/SPECS/piper-kirigami.spec
              export SOURCE_DATE_EPOCH=$(python3 -c '\''import json; print(json.load(open("/rpmbuild/BUILD-INFO.json"))["source_date_epoch"])'\'')
              rpmbuild -ba --define "_topdir /rpmbuild" /rpmbuild/SPECS/piper-kirigami.spec
            '
      - name: Verify dependency closure and installed launcher in clean Fedora container
        env:
          FEDORA: ${{ matrix.fedora }}
        run: |
          docker run --rm -v "$RUNNER_TEMP/rpmbuild:/rpmbuild" \
            "registry.fedoraproject.org/fedora:$FEDORA" bash -euc '
              dnf install -y /rpmbuild/RPMS/noarch/*.rpm
              rpm -q --requires piper-kirigami > /rpmbuild/runtime-requires.txt
              rpm -ql piper-kirigami > /rpmbuild/installed-files.txt
              rpm -qa | sort > /rpmbuild/runtime-packages.txt
              cd /tmp
              timeout 90s piper-kirigami --mock --headless --screenshot /rpmbuild/installed-smoke.png
              test -s /rpmbuild/installed-smoke.png
            '
      - name: Collect RPM, SRPM, source and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/rpm-artifacts"
          cp "$RUNNER_TEMP"/rpmbuild/RPMS/noarch/*.rpm "$RUNNER_TEMP"/rpmbuild/SRPMS/*.rpm \
            "$RUNNER_TEMP"/rpmbuild/SOURCES/*.tar.gz "$RUNNER_TEMP"/rpmbuild/SPECS/*.spec \
            "$RUNNER_TEMP"/rpmbuild/BUILD-INFO.json "$RUNNER_TEMP"/rpmbuild/*.txt \
            "$RUNNER_TEMP"/rpmbuild/installed-smoke.png "$RUNNER_TEMP/rpm-artifacts/"
          cd "$RUNNER_TEMP/rpm-artifacts"
          sha256sum -- * > SHA256SUMS
      - name: Upload tested Fedora artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piper-kirigami-fedora-${{ matrix.fedora }}-${{ github.sha }}
          path: ${{ runner.temp }}/rpm-artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish signed Flatpak repository
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs: [flatpak, rpm]
    runs-on: ubuntu-24.04
    concurrency:
      group: piper-flatpak-repository-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: piper-kirigami-flatpak-x86_64-${{ github.sha }}
          path: release-artifacts
      - name: Reject stale version promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp \
            | python3 -c 'import json,sys; json.dump([r for page in json.load(sys.stdin) for r in page],sys.stdout)' \
            | python3 packaging/repository/check-promotion.py "$RELEASE_TAG"
      - name: Build and verify signed update repository
        env:
          FLATPAK_SIGNING_KEY: ${{ secrets.FLATPAK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$FLATPAK_SIGNING_KEY" || { echo 'Provision FLATPAK_SIGNING_KEY first'; exit 1; }
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg dbus curl
          export GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/piper-signing.XXXXXXXX")
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$FLATPAK_SIGNING_KEY" | base64 --decode | gpg --batch --import
          unset FLATPAK_SIGNING_KEY
          bash packaging/repository/build-repository.sh release-artifacts "$RUNNER_TEMP/piper-site"
          bash packaging/repository/smoke-update.sh "$RUNNER_TEMP/piper-site" "$RUNNER_TEMP/piper-update-evidence"
      - name: Retain migration and update verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piper-update-verification-${{ github.sha }}
          path: ${{ runner.temp }}/piper-update-evidence/
          if-no-files-found: ignore
      - name: Verify and publish exact tested assets without overwriting a release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS
          # Create fails if the release exists. Never replace previously pinned assets.
          # Manual publication creates its tag only after exact-source tests pass.
          # An existing tag is accepted only when it resolves to this exact commit.
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease --title "Piper Kirigami $RELEASE_TAG" \
            --notes "Experimental tested Flatpak. See release.json for source and bundle pins; checksums are not a publisher signature."
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ./*
      - name: Stage signed repository for GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/piper-site
      - name: Deploy signed Flatpak repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Expose release after successful repository deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
